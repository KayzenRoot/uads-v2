name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Record native dependency-review capability
        shell: bash
        run: |
          echo "GitHub dependency-review-action requires Dependency Graph + GitHub Advanced Security on this private repository."
          echo "Native capability status: NOT_CONFIGURED_OR_UNAVAILABLE"
          echo "Security gate used by this repository: npm audit --audit-level=high against the locked dependency graph."
