name: UADS Direct Review Evidence

on:
  workflow_run:
    workflows: [UADS Cross-Platform Compatibility]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: direct-review-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish canonical evidence
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source CI SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact source CI gate receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$SOURCE_CI_SHA" --json databaseId,status,conclusion,headSha,name,event,url > "$RUNNER_TEMP/uads-ci-runs.json"
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/uads-ci-runs.json','utf8')).filter(x=>x.name==='CI'&&x.headSha===process.env.SOURCE_CI_SHA&&x.status==='completed'&&x.conclusion==='success'&&x.event==='push'); if(a.length!==1) { console.error('expected exactly one successful source CI run, found '+a.length); process.exit(1); } fs.writeFileSync(process.env.RUNNER_TEMP+'/uads-source-ci-run.json', JSON.stringify(a[0]));"
          SOURCE_CI_RUN_ID="$(node -e "const fs=require('fs'); process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/uads-source-ci-run.json','utf8')).databaseId))")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID" > "$RUNNER_TEMP/uads-source-ci-run-full.json"
          SOURCE_CI_ATTEMPT="$(node -e "const fs=require('fs'); process.stdout.write(String(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/uads-source-ci-run-full.json','utf8')).run_attempt))")"
          echo "SOURCE_CI_RUN_ID=$SOURCE_CI_RUN_ID" >> "$GITHUB_ENV"
          echo "SOURCE_CI_ATTEMPT=$SOURCE_CI_ATTEMPT" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/uads-source-receipt"
          gh run download "$SOURCE_CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "uads-ci-gate-receipt-$SOURCE_CI_SHA" --dir "$RUNNER_TEMP/uads-source-receipt"
          test -f "$RUNNER_TEMP/uads-source-receipt/uads-ci-gate-receipt.json"
          node scripts/github/validate-ci-gate-receipt.mjs \
            --file "$RUNNER_TEMP/uads-source-receipt/uads-ci-gate-receipt.json" \
            --expected-sha "$SOURCE_CI_SHA" \
            --expected-run-id "$SOURCE_CI_RUN_ID" \
            --expected-run-attempt "$SOURCE_CI_ATTEMPT"

      - name: Setup Node.js 20 for canonical proof generation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Build proof contracts
        run: |
          npm ci
          npm run build

      - name: Publish canonical Direct Review Evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CI_RUN_ID: ${{ env.SOURCE_CI_RUN_ID }}
          SOURCE_CI_RUN_ATTEMPT: ${{ env.SOURCE_CI_ATTEMPT }}
          UADS_SECURITY_PROOF_MAX_ATTEMPTS: 12
          UADS_SECURITY_PROOF_POLL_MS: 5000
        run: |
          node scripts/github/publish-direct-review-evidence.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --receipt "$RUNNER_TEMP/uads-source-receipt/uads-ci-gate-receipt.json" \
            --output "$RUNNER_TEMP/github-direct-review-evidence.json" \
            --checksum-output "$RUNNER_TEMP/github-direct-review-evidence.json.sha256" \
            --source-run-id "$SOURCE_CI_RUN_ID" \
            --source-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --compatibility-run-id "${{ github.event.workflow_run.id }}" \
            --compatibility-run-attempt "${{ github.event.workflow_run.run_attempt }}"

      - name: Validate canonical Direct Review Evidence
        env:
          SOURCE_CI_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_CI_RUN_ID: ${{ env.SOURCE_CI_RUN_ID }}
          SOURCE_CI_ATTEMPT: ${{ env.SOURCE_CI_ATTEMPT }}
        run: |
          node scripts/github/validate-direct-review-standalone.mjs \
            --file "$RUNNER_TEMP/github-direct-review-evidence.json" \
            --expected-sha "$SOURCE_CI_SHA" \
            --expected-source-run-id "$SOURCE_CI_RUN_ID" \
            --expected-source-run-attempt "$SOURCE_CI_ATTEMPT" \
            --expected-version "$(node -p "require('./package.json').version")" \
            --expected-direct-run-id "$GITHUB_RUN_ID"

      - name: Upload canonical Direct Review Evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uads-direct-review-${{ github.event.workflow_run.head_sha }}
          path: |
            ${{ runner.temp }}/github-direct-review-evidence.json
            ${{ runner.temp }}/github-direct-review-evidence.json.sha256
          retention-days: 90
          if-no-files-found: error
