name: Feature request
description: Propose a scoped capability for UADS.
title: "[Feature]: "
labels:
  - type:feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: Proposed capability
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope classification suggestion
      options:
        - trivial
        - local
        - cross-cutting
        - architectural
    validations:
      required: true
  - type: textarea
    id: compatibility-security
    attributes:
      label: Compatibility and security implications
      description: Include global-first, zero-footprint, evidence, and supply-chain considerations.
    validations:
      required: true
